version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # configbuilder's whole job includes rendering the deprecated
      # plaintext credential fields (P3-1) as a fallback when secretRef
      # doesn't supply a value - the admission webhook is what actually
      # keeps normal-path objects from setting them at all, so this isn't
      # dead or accidental usage.
      - linters:
          - staticcheck
        path: controllers/tradebotconfig/configbuilder/
        text: "SA1019"
      # BotPoller.resolveCredentials (P4-3) reads back the same api_server
      # Basic Auth credentials configbuilder renders, with the identical
      # secretRef-overrides-plaintext fallback - same justification as the
      # configbuilder exclusion above, different package.
      - linters:
          - staticcheck
        path: controllers/tradebot/poller.go
        text: "SA1019"
      # Tests that exercise the P3-1 webhook rejection of deprecated
      # plaintext credential fields have to set them to do so.
      - linters:
          - staticcheck
        path: _test\.go
        text: "SA1019"
      # do()'s method parameter only ever receives GET today - P4-3 is
      # poll-only by design (D2/D9) - but it exists specifically so P4-4
      # (start/stop) can add POST calls without reworking this primitive,
      # per the plan's own instruction. Keeping the parameter general now
      # is the point, not an accident.
      - linters:
          - unparam
        path: controllers/tradebot/botclient/client.go
        text: "always receives"
      # UnkownFeeRate is a served v1alpha1 API field - renaming it is a
      # breaking change for anyone with it set, so it stays misspelled here
      # until v1beta1 (B2 in REMAINING-WORK.md) can rename it properly with
      # conversion handling the old name. The rendered config.json key is
      # already fixed (BuildExchangeConfig emits "unknown_fee_rate"); only
      # the Go field/JSON tag lag behind, deliberately.
      - linters:
          - misspell
        path: api/v1alpha1/tradebotconfig_types.go
        text: "`unkown` is a misspelling of `unknown`"
      # "strat" is Strategy's deliberate kubebuilder shortName abbreviation
      # (kubectl get strat), matching the tb/tbot/bt/fui/tbc abbreviations
      # used for the other CRDs - not a typo of "start". Both served
      # versions (v1alpha1 and v1beta1, B3) carry the same marker.
      - linters:
          - misspell
        path: api/v1(alpha1|beta1)/strategy_types\.go
        text: "`strat` is a misspelling of `start`"
      # This file's whole job is proving BuildExchangeConfig does NOT emit
      # the old misspelled key (A1) - the misspelled string has to appear
      # verbatim to test for its absence.
      - linters:
          - misspell
        path: controllers/tradebotconfig/configbuilder/exchange_test.go
        text: "`unkown` is a misspelling of `unknown`"
      # Table-driven/Ginkgo test fixtures legitimately repeat the same short
      # literal (exchange names, credential keys, namespaces) across many
      # small, independent test cases - extracting each into a shared
      # constant would couple otherwise-unrelated tests to each other for no
      # real benefit. Production code still gets goconst's full scrutiny.
      - linters:
          - goconst
        path: _test\.go
      # copyTradeBotStatusFromBeta/copyTradeBotStatusToBeta (P4-4) are a
      # deliberate mirror-image pair, copying the same field list between
      # two structurally-identical but distinctly-named per-version types
      # (see status.go's own doc comment on why they're distinct types, not
      # aliases). There's nothing to extract without reflection or a
      # generics/interface layer heavier than the six-field copy it would
      # replace.
      - linters:
          - dupl
        path: controllers/tradebot/status.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

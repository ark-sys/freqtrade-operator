apiVersion: freqtrade.io/v1alpha1
kind: TradeBot
metadata:
  name: btc-trader
  namespace: freqtrade
  annotations:
    freqtrade.io/preserve-data: "true"
spec:
  botName: BTC-Trader
  tradingMode: spot
  dryRun: true
  dryRunWallet: 1000
  stakeCurrency: USDT
  stakeAmount: "unlimited"
  maxOpenTrades: 5
  fiatDisplayCurrency: USD
  
  # Advanced trading configuration
  tradableBalanceRatio: 0.99
  cancelOpenOrdersOnExit: false
  initialState: "running"
  forceEntryEnable: false
  
  # Timeout configuration
  unfilledTimeout:
    entry: 10
    exit: 10
    exitTimeoutCount: 0
    unit: "minutes"
  
  # Internal processing configuration
  internals:
    processThrottleSecs: 5
  
  # References to other resources
  exchangeRef: binance
  pairlistMethodsRef: default-pairlist-methods
  strategyRef: default-strategy
  entryPricingRef: default-entry-pricing
  exitPricingRef: default-exit-pricing
  orderTypesRef: default-order-types
  riskManagementRef: default-risk
#  notificationRef: telegram-notifications
  
  # Deployment configuration
  image: freqtradeorg/freqtrade:stable
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"
  
  # Storage configuration
  storageSize: "1Gi"
  storageClassName: longhorn
  
  # API configuration
  apiEnabled: true
  apiServer:  
    listenIpAddress: "0.0.0.0"  # Custom IP (default: 0.0.0.0)
    listenPort: 8080              # Custom port (default: 8080)
    verbosity: "error"             # Custom verbosity (default: error)
    enableOpenapi: true           # Enable OpenAPI docs (default: false)
    username: "admin"             # API username (default: none)
    password: "secret"            # API password (default: none)
  corsOrigins:
    - "https://frequi.example.com"
    - "https://btc-trader.frequi.example.com"

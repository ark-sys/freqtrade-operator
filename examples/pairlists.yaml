apiVersion: freqtrade.io/v1alpha1
kind: Pairlists
metadata:
  name: default-pairlists
  namespace: freqtrade
spec:
  pairlists:
    - method: StaticPairList
      allow_inactive: false
    - method: VolumePairList
      number_assets: 20
      sort_key: quoteVolume
      refresh_period: 1800
    - method: AgeFilter
      min_days_listed: 10
    - method: PriceFilter
      min_price: 0.00000100
    - method: VolatilityFilter
      lookback_days_volatility: 3
      min_volatility: 0.02
      max_volatility: 0.75
    - method: SpreadFilter
      max_spread_ratio: 0.005
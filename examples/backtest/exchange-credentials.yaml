---
apiVersion: v1
kind: Secret
metadata:
  name: exchange-credentials
  namespace: freqtrade-backtest-example
type: Opaque
stringData:
  # Backtesting only ever reads historical market data, never places an order - many exchanges,
  # Binance included, serve that over their public (unauthenticated) endpoints, so api-key/secret
  # can often be left blank here. Real, read-only-scoped credentials are still the safer default
  # for anything beyond a quick try: without them you're sharing the exchange's public rate limit
  # with every other unauthenticated caller, which download-data can hit fast for a wide pair list
  # or a long timerange.
  api-key: "your-api-key-here"
  secret: "your-secret-here"

# This file defines an Exchange resource that contains configuration for a cryptocurrency exchange, such as Binance. It includes API keys, CCXT configuration, and references to whitelists and blacklists for trading pairs.
# Credentials for the exchange should be stored in a Kubernetes Secret
apiVersion: freqtrade.io/v1alpha1
kind: Exchange
metadata:
  name: binance
  namespace: freqtrade
spec:
  name: binance
  secretRef: binance-credentials
  whitelistRef: crypto-whitelist
  blacklistRef: crypto-blacklist
  ccxt_config:
    enableRateLimit: true
    options:
      defaultType: spot
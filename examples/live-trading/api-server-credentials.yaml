---
apiVersion: v1
kind: Secret
metadata:
  name: api-server-credentials
  namespace: freqtrade-example
type: Opaque
stringData:
  # These keys are exact: the operator reads "user"/"password" from this Secret
  # (controllers/tradebotconfig/configbuilder/bot.go) - not "username", and there's no
  # separate key for the JWT signing secret because the operator generates and persists
  # one automatically the first time it doesn't find one (config.yaml's apiServer.secretRef
  # below only needs to supply what a human actually has to choose).
  user: "admin"
  password: "secure-password"

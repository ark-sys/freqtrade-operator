apiVersion: freqtrade.io/v1alpha1
kind: FreqUI
metadata:
  name: freqtrade-ui
  namespace: freqtrade
spec:
  image: freqtradeorg/frequi:latest
  host: frequi.example.com
  ingressAnnotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    - hosts:
        - frequi.example.com
      secretName: frequi-tls
  # TradeBots that this FreqUI should manage
  tradeBotRefs:
    - btc-trader
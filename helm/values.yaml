# Default values for freqtrade-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# Controller Manager Configuration
controllerManager:
  # Number of replicas for the controller manager
  replicas: 1
  
  # Container image settings
  image:
    repository: arksys/freqtrade-operator
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  
  # Log level for the controller manager (debug, info, warn, error)
  logLevel: info
  
  # Additional arguments to pass to the controller manager
  extraArgs: []
  
  # Resource limits and requests for the controller manager
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 64Mi
  
  # Liveness probe configuration
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  
  # Readiness probe configuration
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
  
  # Termination grace period in seconds
  terminationGracePeriodSeconds: 10
  
  # Additional volumes for the controller manager.
  #
  # P1-4 admission webhooks (see cmd/main.go's --webhook-cert-path) need a
  # TLS cert mounted here. This chart does not yet template the
  # ValidatingWebhookConfiguration or a cert-manager Certificate/Issuer
  # itself (available today via kustomize: config/webhook + config/certmanager) -
  # uncomment below once you've pointed a cert-manager Certificate (or any
  # other source) at a Secret named webhook-server-cert in this release's
  # namespace, and add --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
  # to extraArgs above.
  volumes: []
  # - name: webhook-certs
  #   secret:
  #     secretName: webhook-server-cert

  # Additional volume mounts for the controller manager
  volumeMounts: []
  # - name: webhook-certs
  #   mountPath: /tmp/k8s-webhook-server/serving-certs
  #   readOnly: true
  
  # Metrics configuration
  metrics:
    enabled: true
    service:
      type: ClusterIP
    # Requires the Prometheus Operator's ServiceMonitor CRD to already be
    # installed in the cluster - off by default for the same reason
    # config/prometheus is commented out of the kustomize build by default.
    serviceMonitor:
      enabled: false

# This is for the secrets for pulling an image from a private repository
imagePullSecrets: []

# This section builds out the service account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true

# This is for setting Kubernetes Annotations to a Pod.
podAnnotations: {}

# This is for setting Kubernetes Labels to a Pod.
podLabels: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - "ALL"

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# PriorityClassName for the controller manager pod. Unset by default; set it to your
# cluster's own "system-cluster-critical" or similar if the operator being evicted
# before the trading workloads it manages matters to you.
priorityClassName: ""

# Spread controller manager replicas across failure domains - only meaningful once
# controllerManager.replicas is scaled above 1.
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: ScheduleAnyway
#   labelSelector:
#     matchLabels:
#       control-plane: controller-manager

# Pod Disruption Budget for the controller manager. Off by default: at the default
# controllerManager.replicas: 1, a minAvailable: 1 PDB would block voluntary node
# drains from ever evicting the only replica at all, rather than just protecting
# availability - enable this once you've scaled replicas to 2+ for real HA via
# leader election.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Affinity for pod assignment
affinity: {}
# Recommended for production:
# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#         - matchExpressions:
#           - key: kubernetes.io/arch
#             operator: In
#             values:
#               - amd64
#               - arm64
#           - key: kubernetes.io/os
#             operator: In
#             values:
#               - linux

# Default values for freqtrade-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# Controller Manager Configuration
controllerManager:
  # Number of replicas for the controller manager
  replicas: 1
  
  # Container image settings
  image:
    repository: registry.horizonscloud.ovh/freqtrade-operator
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  
  # Log level for the controller manager (debug, info, warn, error)
  logLevel: info
  
  # Additional arguments to pass to the controller manager
  extraArgs: []
  
  # Resource limits and requests for the controller manager
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 64Mi
  
  # Liveness probe configuration
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  
  # Readiness probe configuration
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
  
  # Termination grace period in seconds
  terminationGracePeriodSeconds: 10
  
  # Additional volumes for the controller manager
  volumes: []
  # - name: webhook-certs
  #   secret:
  #     secretName: webhook-server-certs
  
  # Additional volume mounts for the controller manager
  volumeMounts: []
  # - name: webhook-certs
  #   mountPath: /tmp/k8s-webhook-server/serving-certs
  #   readOnly: true
  
  # Metrics configuration
  metrics:
    enabled: true
    service:
      type: ClusterIP

# This is for the secrets for pulling an image from a private repository
imagePullSecrets: []

# This section builds out the service account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true

# This is for setting Kubernetes Annotations to a Pod.
podAnnotations: {}

# This is for setting Kubernetes Labels to a Pod.
podLabels: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - "ALL"

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity for pod assignment
affinity: {}

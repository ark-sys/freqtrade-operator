{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "freqtrade-operator.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "freqtrade-operator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "freqtrade-operator.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "freqtrade-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }} 
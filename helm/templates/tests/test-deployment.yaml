apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "freqtrade-operator.fullname" . }}-test-deployment"
  labels:
    {{- include "freqtrade-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: test-deployment
      image: bitnami/kubectl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing Freqtrade Operator deployment..."
          
          # Wait for deployment to be ready
          kubectl wait --for=condition=available --timeout=300s deployment/{{ include "freqtrade-operator.fullname" . }}-controller-manager -n {{ .Release.Namespace }}
          
          # Check if CRDs are installed
          echo "Checking CRDs..."
          kubectl get crd | grep freqtrade.io | wc -l | grep -q "11" || (echo "Expected 11 CRDs, found less" && exit 1)
          
          # Check if controller manager is running
          echo "Checking controller manager pods..."
          kubectl get pods -l control-plane=controller-manager -n {{ .Release.Namespace }} | grep Running
          
          {{- if .Values.controllerManager.metrics.enabled }}
          # Test metrics endpoint if enabled
          echo "Testing metrics endpoint..."
          kubectl exec deployment/{{ include "freqtrade-operator.fullname" . }}-controller-manager -n {{ .Release.Namespace }} -- curl -s http://localhost:8080/metrics | head -5
          {{- end }}
          
          echo "All tests passed!"
  restartPolicy: Never
  serviceAccountName: {{ include "freqtrade-operator.serviceAccountName" . }} 
{{- if .Values.controllerManager.metrics.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freqtrade-operator.fullname" . }}-controller-manager-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "freqtrade-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  type: {{ .Values.controllerManager.metrics.service.type }}
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: 8443
  selector:
    {{- include "freqtrade-operator.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
{{- end }}

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: exitpricings.freqtrade.io
spec:
  group: freqtrade.io
  names:
    kind: ExitPricing
    plural: exitpricings
    singular: exitpricing
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                priceSide:
                  type: string
                  description: Side of the spread to use for exit (ask, bid, same, other)
                priceLastBalance:
                  type: boolean
                  description: Interpolate the exiting price
                useOrderBook:
                  type: boolean
                  description: Use order book for exit
                orderBookTop:
                  type: integer
                  description: Top N rate in order book to use
                checkDepthOfMarket:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    bidsToAskDelta:
                      type: number
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
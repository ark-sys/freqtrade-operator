apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ordertypes.freqtrade.io
spec:
  group: freqtrade.io
  names:
    kind: OrderTypes
    plural: ordertypes
    singular: ordertypes
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                entry:
                  type: string
                  description: Order type for entry (e.g., limit, market)
                exit:
                  type: string
                  description: Order type for exit
                emergencyExit:
                  type: string
                  description: Order type for emergency exit
                forceEntry:
                  type: string
                  description: Order type for force entry
                forceExit:
                  type: string
                  description: Order type for force exit
                stoploss:
                  type: string
                  description: Order type for stoploss
                stoplossOnExchange:
                  type: boolean
                  description: Place stoploss on exchange
                stoplossOnExchangeInterval:
                  type: integer
                  description: Interval for stoploss on exchange
                stoplossOnExchangeLimitRatio:
                  type: number
                  description: Limit ratio for stoploss on exchange
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
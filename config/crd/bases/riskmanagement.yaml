apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: riskmanagements.freqtrade.io
spec:
  group: freqtrade.io
  names:
    kind: RiskManagement
    plural: riskmanagements
    singular: riskmanagement
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                minimalRoi:
                  type: object
                  additionalProperties:
                    type: number
                  description: Mapping of minutes to ROI ratio
                stoploss:
                  type: number
                  description: Stoploss as a negative ratio
                trailingStop:
                  type: boolean
                trailingStopPositive:
                  type: number
                trailingStopPositiveOffset:
                  type: number
                trailingOnlyOffsetIsReached:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
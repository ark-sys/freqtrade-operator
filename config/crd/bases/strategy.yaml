apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: strategies.freqtrade.io
spec:
  group: freqtrade.io
  names:
    kind: Strategy
    plural: strategies
    singular: strategy
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                script:
                  type: string
                  description: Inline strategy script or reference
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
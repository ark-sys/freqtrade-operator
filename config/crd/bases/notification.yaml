apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: notifications.freqtrade.io
spec:
  group: freqtrade.io
  names:
    kind: Notification
    plural: notifications
    singular: notification
  scope: Namespaced
  versions:

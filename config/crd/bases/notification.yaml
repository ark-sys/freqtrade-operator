              type: object
              properties:
                telegram:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    token:
                      type: string
                    chatId:
                      type: string
                    balanceDustLevel:
                      type: number
                    reload:
                      type: boolean
                    allowCustomMessages:
                      type: boolean
                webhook:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    url:
                      type: string
                    entry:
                      type: string
                    entryCancel:
                      type: string
                    entryFill:
                      type: string
                    exit:
                      type: string
                    exitCancel:
                      type: string
                    exitFill:
                      type: string
                    status:
                      type: string
                    allowCustomMessages:
                      type: boolean
                apiServer:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    listenIpAddress:
                      type: string
                    listenPort:
                      type: integer
                    verbosity:
                      type: string
                    username:
                      type: string
                    password:
                      type: string
                    wsToken:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
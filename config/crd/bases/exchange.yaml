apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: exchanges.freqtrade.io
spec:
  group: freqtrade.io
  names:
    kind: Exchange
    plural: exchanges
    singular: exchange
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                apiKey:
                  type: string
                secret:
                  type: string
                ccxtConfig:
                  type: object
                  additionalProperties: true
                ccxtAsyncConfig:
                  type: object
                  additionalProperties: true
                whitelistRef:
                  type: string
                  description: Reference to a PairList resource for whitelisting
                blacklistRef:
                  type: string
                  description: Reference to a PairList resource for blacklisting
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: entrypricings.freqtrade.io
spec:
  group: freqtrade.io
  names:
    kind: EntryPricing
    plural: entrypricings
    singular: entrypricing
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                priceSide:
                  type: string
                  description: Side of the spread to use for entry (ask, bid, same, other)
                priceLastBalance:
                  type: boolean
                  description: Interpolate the bidding price
                useOrderBook:
                  type: boolean
                  description: Use order book for entry
                orderBookTop:
                  type: integer
                  description: Top N rate in order book to use
                checkDepthOfMarket:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    bidsToAskDelta:
                      type: number
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
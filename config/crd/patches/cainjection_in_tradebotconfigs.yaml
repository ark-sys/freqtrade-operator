# The conversion webhook (see conversion_in_tradebotconfigs.yaml) is served
# over TLS by the same webhook server the validating webhooks already
# use - the API server needs this CRD to trust that server's CA. The
# actual namespace/name values are filled in by config/default's own
# cert-manager replacements (this placeholder is what those target).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    cert-manager.io/inject-ca-from: CERTIFICATE_NAMESPACE/CERTIFICATE_NAME
  name: tradebotconfigs.freqtrade.io

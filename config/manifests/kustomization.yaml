# These resources constitute the fully configured set of manifests
# used to generate the 'manifests/' directory in a bundle.
resources:
- bases/freqtrade-operator.clusterserviceversion.yaml
- ../default
#- ../samples
- ../scorecard

# [WEBHOOK] This project has webhooks (P1-4 validating, P6-5 conversion), so this section is active.
# Do NOT uncomment sections with prefix [CERTMANAGER], as OLM does not support cert-manager.
# These patches remove the unnecessary "cert" volume and its manager container volumeMount - OLM injects its
# own set of certs instead. Indices below (containers/0, volumeMounts/0, volumes/0) match this project's
# manager Deployment as of P6-5 (single "manager" container; the only volume/volumeMount is the cert-manager
# one added by config/default/manager_webhook_patch.yaml, since the base config/manager/manager.yaml has none) -
# re-verify them if either patch's shape changes.
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: controller-manager
    namespace: system
  patch: |-
    # Remove the manager container's "cert" volumeMount, since OLM will create and mount a set of certs.
    # Update the indices in this path if adding or removing containers/volumeMounts in the manager's Deployment.
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts/0
    # Remove the "cert" volume, since OLM will create and mount a set of certs.
    # Update the indices in this path if adding or removing volumes in the manager's Deployment.
    - op: remove
      path: /spec/template/spec/volumes/0

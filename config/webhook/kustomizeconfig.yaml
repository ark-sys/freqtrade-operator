# This configuration is for teaching kustomize how to update the
# name ref and namespace ref for ValidatingWebhookConfiguration and MutatingWebhookConfiguration.
nameReference:
  - kind: Service
    version: v1
    fieldSpecs:
      - kind: ValidatingWebhookConfiguration
        group: admissionregistration.k8s.io
        path: webhooks/clientConfig/service/name
      - kind: MutatingWebhookConfiguration
        group: admissionregistration.k8s.io
        path: webhooks/clientConfig/service/name

namespace:
  - kind: ValidatingWebhookConfiguration
    group: admissionregistration.k8s.io
    path: webhooks/clientConfig/service/namespace
    create: true
  - kind: MutatingWebhookConfiguration
    group: admissionregistration.k8s.io
    path: webhooks/clientConfig/service/namespace
    create: true

varReference:
  - path: metadata/annotations
    kind: CustomResourceDefinition

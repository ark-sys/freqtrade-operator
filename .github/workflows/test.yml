name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Check coverage against the ratcheted floors
        run: make coverage-gate

      - name: Check sigs.k8s.io/gateway-api hasn't drifted off its pinned version
        run: make gateway-api-version-gate

      - name: Verify generated manifests are up to date
        run: |
          make manifests generate
          git diff --exit-code

      - name: Verify the Helm chart is in sync with config/
        run: |
          make helm-sync
          git diff --exit-code helm/

      - name: Verify the generated API reference is up to date
        run: |
          make api-docs
          git diff --exit-code docs/

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

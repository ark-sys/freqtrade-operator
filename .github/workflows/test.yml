name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Check coverage against the ratcheted floors
        run: make coverage-gate

      - name: Verify generated manifests are up to date
        run: |
          make manifests generate
          git diff --exit-code

      - name: Verify the Helm chart is in sync with config/
        run: |
          make helm-sync
          git diff --exit-code helm/

      - name: Verify the generated API reference is up to date
        run: |
          make api-docs
          git diff --exit-code docs/

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

name: Helm Chart Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'helm/**'
      - '.github/workflows/helm-release.yml'

jobs:
  helm-release:
    name: Package and Release Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "CHART_VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          else
            VERSION="0.1.0-dev.$(date +'%Y%m%d').$(git rev-parse --short HEAD)"
            APP_VERSION="v$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "CHART_VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Update Chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.get_version.outputs.CHART_VERSION }}/" helm/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.get_version.outputs.APP_VERSION }}\"/" helm/Chart.yaml

      - name: Lint Helm Chart
        run: |
          helm lint helm/
          helm template freqtrade-operator helm/ --debug

      - name: Package Helm Chart
        run: |
          helm package helm/ --destination .helm-releases/

      - name: Create charts directory for GitHub Pages
        run: |
          mkdir -p .helm-releases
          
      - name: Generate Helm repository index
        run: |
          helm repo index .helm-releases --url https://${{ github.repository_owner }}.github.io/freqtrade-operator/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .helm-releases
          destination_dir: .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm Chart to OCI Registry
        run: |
          helm push .helm-releases/freqtrade-operator-${{ steps.get_version.outputs.CHART_VERSION }}.tgz oci://ghcr.io/${{ github.repository_owner }}

      - name: Create GitHub Release for Helm Chart
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            .helm-releases/freqtrade-operator-${{ steps.get_version.outputs.CHART_VERSION }}.tgz
          name: "Helm Chart v${{ steps.get_version.outputs.VERSION }}"
          tag_name: "helm-v${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Helm Chart Release v${{ steps.get_version.outputs.VERSION }}
            
            This release contains the Helm chart for freqtrade-operator v${{ steps.get_version.outputs.APP_VERSION }}.
            
            ### Installation
            
            #### Using Helm Repository
            ```bash
            helm repo add freqtrade-operator https://${{ github.repository_owner }}.github.io/freqtrade-operator/
            helm repo update
            helm install my-freqtrade-operator freqtrade-operator/freqtrade-operator
            ```
            
            #### Using OCI Registry
            ```bash
            helm install my-freqtrade-operator oci://ghcr.io/${{ github.repository_owner }}/freqtrade-operator --version ${{ steps.get_version.outputs.CHART_VERSION }}
            ```
            
            #### Using Local Chart
            ```bash
            helm install my-freqtrade-operator ./helm/
            ```
            
            ### ArgoCD Usage
            ```yaml
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            metadata:
              name: freqtrade-operator
              namespace: argocd
            spec:
              project: default
              source:
                repoURL: https://${{ github.repository_owner }}.github.io/freqtrade-operator/
                chart: freqtrade-operator
                targetRevision: ${{ steps.get_version.outputs.CHART_VERSION }}
                helm:
                  values: |
                    controllerManager:
                      image:
                        tag: "${{ steps.get_version.outputs.APP_VERSION }}"
              destination:
                server: https://kubernetes.default.svc
                namespace: freqtrade-operator-system
              syncPolicy:
                automated:
                  prune: true
                  selfHeal: true
                syncOptions:
                  - CreateNamespace=true
            ``` 
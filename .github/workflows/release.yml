name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write   # softprops/action-gh-release creates/updates the GitHub Release
  id-token: write   # sigstore/cosign-installer's keyless signing needs an OIDC token

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # latest only ever points at an actual tagged release - a push straight
      # to main (untagged) still gets its own versioned tag below, but never
      # moves latest, so that alias can't silently go backwards/sideways to
      # whatever the most recent commit happened to be (P3-5).
      - name: Get version and tags
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="arksys/freqtrade-operator:${VERSION}"$'\n'"arksys/freqtrade-operator:latest"
          else
            VERSION="v$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
            TAGS="arksys/freqtrade-operator:${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION }}
          tags: ${{ steps.get_version.outputs.TAGS }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing: cosign requests a short-lived certificate from
      # Sigstore's Fulcio using this job's own GitHub Actions OIDC token
      # (id-token: write, above) and records the signature in Sigstore's
      # public Rekor transparency log - no signing key for this repo to
      # generate, store, or ever rotate. Signs by digest, not by tag: a tag
      # is mutable, the digest docker/build-push-action just pushed is what
      # was actually built.
      - name: Sign the image
        run: cosign sign --yes "arksys/freqtrade-operator@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: arksys/freqtrade-operator@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: freqtrade-operator-sbom.spdx.json
          upload-artifact: true

      - name: Generate release artifacts
        run: |
          make manifests
          mkdir -p release-artifacts
          cp -r config/crd/bases/* release-artifacts/
          tar -czf freqtrade-operator-crds.tar.gz -C release-artifacts .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            freqtrade-operator-crds.tar.gz
            freqtrade-operator-sbom.spdx.json
          draft: false
          prerelease: false
          generate_release_notes: true

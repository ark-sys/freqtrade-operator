name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write   # softprops/action-gh-release creates/updates the GitHub Release
  id-token: write   # sigstore/cosign-installer's keyless signing needs an OIDC token
  packages: write   # pushes the image to ghcr.io under this repo

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest only ever points at an actual tagged release - a push straight
      # to main (untagged) still gets its own versioned tag below, but never
      # moves latest, so that alias can't silently go backwards/sideways to
      # whatever the most recent commit happened to be (P3-5).
      - name: Get version and tags
        id: get_version
        run: |
          IMG_BASE="ghcr.io/${{ github.repository_owner }}/freqtrade-operator"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${IMG_BASE}:${VERSION}"$'\n'"${IMG_BASE}:latest"
          else
            VERSION="v$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
            TAGS="${IMG_BASE}:${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # linux/amd64,linux/arm64 - same pair `make docker-buildx` builds locally. No QEMU setup needed: the
      # Dockerfile's builder stage is pinned to --platform=$BUILDPLATFORM, so buildx cross-compiles the Go
      # binary natively for each target rather than emulating the build itself.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION }}
          tags: ${{ steps.get_version.outputs.TAGS }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing: cosign requests a short-lived certificate from
      # Sigstore's Fulcio using this job's own GitHub Actions OIDC token
      # (id-token: write, above) and records the signature in Sigstore's
      # public Rekor transparency log - no signing key for this repo to
      # generate, store, or ever rotate. Signs by digest, not by tag: a tag
      # is mutable, the digest docker/build-push-action just pushed is what
      # was actually built.
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/freqtrade-operator@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/freqtrade-operator@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: freqtrade-operator-sbom.spdx.json
          upload-artifact: true

      - name: Generate release artifacts
        run: |
          make manifests
          mkdir -p release-artifacts
          cp -r config/crd/bases/* release-artifacts/
          tar -czf freqtrade-operator-crds.tar.gz -C release-artifacts .
          # install.yaml is the one-step `kubectl apply -f` the README's own
          # install instructions promise (P7-3) - CRDs, RBAC, webhooks and
          # the Deployment in one file, built from the exact image this same
          # job just pushed and signed, not a placeholder.
          make build-installer IMG="ghcr.io/${{ github.repository_owner }}/freqtrade-operator:${{ steps.get_version.outputs.VERSION }}"

      # OLM bundle image, toward an eventual OperatorHub listing (P7-3) - tag-only, like the GitHub Release
      # below: an OLM bundle is meant to represent one real, addable-to-a-catalog version, not every dev build
      # off main. operator-sdk self-installs via the Makefile's own download logic, same as kustomize/
      # controller-gen already do in test.yml - no new tool pre-install needed in this runner.
      - name: Build and push OLM bundle image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          BARE_VERSION="${{ steps.get_version.outputs.VERSION }}"
          BARE_VERSION="${BARE_VERSION#v}"
          make bundle IMG="ghcr.io/${{ github.repository_owner }}/freqtrade-operator:${{ steps.get_version.outputs.VERSION }}" VERSION="${BARE_VERSION}"
          make bundle-build bundle-push VERSION="${BARE_VERSION}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/install.yaml
            freqtrade-operator-crds.tar.gz
            freqtrade-operator-sbom.spdx.json
          draft: false
          prerelease: false
          generate_release_notes: true
